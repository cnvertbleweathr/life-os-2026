name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all Python files
        run: python -m compileall -q api pipelines scripts dbt/macros

  python-tests:
    name: Python tests (write path, freshness, Spotify compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install "fastapi>=0.137" httpx "dlt[duckdb]>=1.4" "duckdb>=1.5" pandas pyarrow python-dotenv requests pyyaml spotipy google-auth google-auth-oauthlib google-api-python-client pytest
      - name: Run tests (temp data dir + temp DuckDB, no real data)
        run: python -m pytest -q

  shellcheck:
    name: ShellCheck (ops scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash ops/macmini/*.sh

  hardcode-audit:
    name: Hardcoded-year audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on stray hardcoded prior-year comparisons
        run: |
          set -e
          YEAR=$(date +%Y)
          LAST_YEAR=$((YEAR - 1))
          # Catches the class of bug fixed in fitness_metrics.py: a literal
          # comparison against last year's number that should have rolled
          # forward to datetime.now().year (or an explicit --year arg).
          if grep -rn "== ${LAST_YEAR}\b" --include="*.py" api pipelines scripts; then
            echo ""
            echo "Found a hardcoded ${LAST_YEAR} comparison above."
            echo "Check whether it should use datetime.now().year or tz_utils.denver_year() instead."
            exit 1
          fi
          echo "No stray ${LAST_YEAR} hardcodes found."

  dbt-staging-guard:
    name: dbt models don't read dlt staging schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on references to *_staging schemas
        run: |
          # dlt's <dataset>_staging schemas hold only the latest merge load.
          # mart_cfb_live_strength read cfbd_staging.games and lost 2021-2025.
          if grep -rnE "\b[a-z_]+_staging\.[a-z_]+" dbt/models | grep -vE "^[^:]+:[0-9]+:[[:space:]]*--"; then
            echo "Read from the real dataset (e.g. cfbd.games), not dlt's staging copy."
            exit 1
          fi

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt-duckdb
        run: pip install dbt-duckdb
      - name: dbt parse (validates Jinja/SQL/schema, no live warehouse needed)
        env:
          DBT_PROFILES_DIR: ./profiles
        run: dbt parse

  typescript:
    name: Next.js TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
