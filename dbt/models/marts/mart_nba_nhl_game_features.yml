version: 2

models:
  - name: mart_nba_game_features
    description: One row per NBA game with pregame home / away / gap features (no lookahead), the ratings-implied spread and the market line.
    columns:
      - name: game_key
        data_tests: [unique, not_null]
      - name: home_team
        data_tests: [not_null]

  - name: mart_nhl_game_features
    description: One row per NHL game with pregame home / away / gap features (no lookahead), the xG-implied win probability and the no-vig market probability.
    columns:
      - name: game_key
        data_tests: [unique, not_null]
      - name: home_team
        data_tests: [not_null]

  - name: mart_nba_team_profiles
    description: Walk-forward NBA team ATS profiles per (team, season they apply to), from the four prior seasons only. Descriptive, not a rule.
    data_tests:
      - unique:
          arguments:
            column_name: "team_code || season"
    columns:
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['ELITE', 'STRONG', 'NEUTRAL', 'FADE', 'STRONG_FADE']

  - name: mart_nhl_team_profiles
    description: Walk-forward NHL team puck-line profiles per (team, season they apply to), from the four prior seasons only. Descriptive, not a rule.
    data_tests:
      - unique:
          arguments:
            column_name: "team_code || season"
    columns:
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['ELITE', 'STRONG', 'NEUTRAL', 'FADE', 'STRONG_FADE']
