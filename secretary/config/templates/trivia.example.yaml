# Template for data/secretary/templates/trivia.yaml (gitignored; the real file never gets committed).
#   cp secretary/config/templates/trivia.example.yaml data/secretary/templates/trivia.yaml
# Trivia shows once, on the day, as one line in the paper. For a laugh; add your own.

- key: groundhog_day
  name: Groundhog Day
  tier: trivia
  when: "02-02"
  match: [Groundhog Day]
  milestones:
    - {days_before: 0, surfaces: [paper], text: "Groundhog Day. If this line feels familiar, that's the point."}

