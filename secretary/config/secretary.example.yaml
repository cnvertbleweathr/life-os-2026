# Template for data/secretary/secretary.yaml (gitignored; the real file never gets committed).
#
#   mkdir -p data/secretary && cp secretary/config/secretary.example.yaml data/secretary/secretary.yaml
#
# Anything written <LIKE THIS> is a placeholder and is skipped until filled in.
# `uv run python -m secretary.config --check` lists what's left.
#
# Importance tiers, first match wins (dbt: int_events_tiered):
#   1. calendar event title starts with "!"      → critical ("!" is stripped for display)
#   2. birthday of someone in critical_people     → critical
#   3. any other birthday                         → important
#   4. an event a template covers (templates/)    → the template's tier
#   5. everything else                            → nice_to_know
# A critical-tier birthday template adds its person to critical_people automatically.

# People whose birthdays are critical. `match` lists how the name appears in
# calendar birthday titles (the contacts Birthdays calendar uses the contact name).
critical_people:
  - name: <WIFE'S NAME>
    match: [<WIFE'S NAME AS IN CONTACTS>]
  - name: <MUM'S NAME>
    match: [<MUM'S NAME AS IN CONTACTS>]
  - name: <CHILD'S NAME>
    match: [<CHILD'S NAME>]

# A non-critical heads-up is shown at most this many times, then stops.
# Critical heads-ups ignore the limit.
nag_limit: 2

# nice_to_know events appear in the paper's Coming Up box this many days ahead.
coming_up_days: 14

# Default heads-up rhythm per tier. A template's own `milestones` replace these.
#   days_before  0 = the day itself
#   surfaces     paper (a heads-up line), paper_lead (the paper's lead item), checkin (Slack packet).
#                The website's Secretary page always lists every open heads-up.
#   text         {name} the event, {date} "Sat Dec 19", {days} days to go
rhythms:
  critical_birthday:
    - {days_before: 21, surfaces: [checkin], text: "{name} is in 3 weeks ({date}). Gift ideas?"}
    - {days_before: 10, surfaces: [paper], text: "{name} in 10 days ({date}): order now if it has to ship."}
    - {days_before: 3, surfaces: [paper, checkin], text: "{name} in 3 days: card and plans sorted?"}
    - {days_before: 0, surfaces: [paper_lead], text: "Today: {name}."}
  critical:
    - {days_before: 21, surfaces: [checkin], text: "{name} is in 3 weeks ({date}). Anything to prepare?"}
    - {days_before: 10, surfaces: [paper], text: "{name} in 10 days ({date})."}
    - {days_before: 3, surfaces: [paper, checkin], text: "{name} in 3 days: all set?"}
    - {days_before: 0, surfaces: [paper_lead], text: "Today: {name}."}
  important:
    - {days_before: 7, surfaces: [paper, checkin], text: "{name} is a week out ({date})."}
    - {days_before: 0, surfaces: [paper], text: "Today: {name}."}
  nice_to_know: []
  trivia:
    - {days_before: 0, surfaces: [paper], text: "Today is {name}."}

# Phone notifications are off: heads-ups go only to the printed paper, the ONS
# website and the Slack check-in packet. Reserved for later; nothing reads it as true yet.
phone_notifications: false
